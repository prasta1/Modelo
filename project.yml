name: Modelo
options:
  bundleIdPrefix: com.peregrine
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
# First third-party dependencies (deliberate exception — see MERGE_PLAN §1.1):
# Markdown (GFM) rendering for chat messages + syntax-highlighted code blocks.
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: "2.3.0"
settings:
  base:
    # Automatic signing lets Xcode pick the right identity per machine.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Modelo:
    type: application
    platform: macOS
    sources:
      - Modelo
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlightr
        product: Highlightr
    # Explicit Info.plist (not GENERATE_INFOPLIST_FILE) so we can declare an ATS
    # exception: LM Studio serves plain HTTP over Tailscale, which App Transport
    # Security blocks by default — without this, every request silently fails and
    # servers always read as offline.
    info:
      path: Modelo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHumanReadableCopyright: "© 2025 Patrick Ruster"
    # See Signing.xcconfig for why signing is per-dev.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Modelo
        PRODUCT_MODULE_NAME: Modelo
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "3"
        ENABLE_HARDENED_RUNTIME: YES
        # Keychain access group → forces an embedded provisioning profile with
        # com.apple.application-identifier, required for the data-protection
        # keychain (see Modelo.entitlements). Without it, KeychainStore falls back
        # to the legacy login keychain and macOS prompts for a password per build.
        CODE_SIGN_ENTITLEMENTS: Modelo/Modelo.entitlements
        SWIFT_VERSION: "5.0"
  # iOS companion (slice 1 of docs/superpowers/specs/2026-10-27-ios-foundation-design.md).
  # Compiles an explicit list of portable shared files rather than whole folders:
  # Mac-only services (Process, AppKit) are left out, not #if-guarded in.
  ModeloiOS:
    type: application
    platform: iOS
    sources:
      - ModeloiOS
      - Modelo/Models
      - Modelo/Services/Endpoint.swift
      - Modelo/Services/ServerRegistry.swift
      - Modelo/Services/KeychainStore.swift
      - Modelo/Services/Log.swift
      - Modelo/Services/ReachabilityMonitor.swift
      - Modelo/Services/PollingLoop.swift
      - Modelo/Services/LMStudioClient.swift
      - Modelo/Services/StoreBootstrap.swift
      - Modelo/Services/CloudPreset.swift
      - Modelo/Services/Tool.swift
      - Modelo/Services/SSELineParser.swift
      - Modelo/Services/OpenRouterCatalog.swift
      - Modelo/Services/ChatProvider.swift
    # Same ATS exception as the Mac target (plain HTTP to LM Studio over Tailscale).
    # NSLocalNetworkUsageDescription is required before iOS lets the app reach LAN
    # hosts; without it local servers fail silently and read as offline.
    info:
      path: ModeloiOS/Info.plist
      properties:
        CFBundleDisplayName: Modelo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Modelo connects to model servers on your local network and Tailscale."
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Modelo
        PRODUCT_MODULE_NAME: ModeloiOS
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Keychain access group, as on the Mac (see Modelo/Modelo.entitlements).
        CODE_SIGN_ENTITLEMENTS: ModeloiOS/ModeloiOS.entitlements
        SWIFT_VERSION: "5.0"
  ModeloTests:
    type: bundle.unit-test
    platform: macOS
    # Same team as the app; without it, Xcode test runs fail to sign.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - ModeloTests
    dependencies:
      - target: Modelo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Distinct from the app's ID, which Signing.xcconfig would otherwise apply.
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).tests
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Modelo.app/Contents/MacOS/Modelo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Modelo:
    build:
      targets:
        Modelo: all
    test:
      targets:
        - ModeloTests
  ModeloiOS:
    build:
      targets:
        ModeloiOS: all
