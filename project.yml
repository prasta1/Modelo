name: Modelo
options:
  bundleIdPrefix: com.peregrine
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Dependencies cover Markdown rendering, syntax highlighting, and secure in-app
# updates. Sparkle is deliberate: use its installer instead of writing our own.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: "2.3.0"
settings:
  base:
    # Automatic signing lets Xcode pick the right identity per machine.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Modelo:
    type: application
    platform: macOS
    sources:
      - Modelo
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlightr
        product: Highlightr
    # Explicit Info.plist (not GENERATE_INFOPLIST_FILE) so we can declare an ATS
    # exception: LM Studio serves plain HTTP over Tailscale, which App Transport
    # Security blocks by default — without this, every request silently fails and
    # servers always read as offline.
    info:
      path: Modelo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        SUFeedURL: https://github.com/prasta1/Modelo/releases/latest/download/appcast.xml
        SUPublicEDKey: "DrcyymYIWUzHjaxqZQRlnNhJxXkB6KN6SfrwUJpVAbY="
        # Keep background checks opt-in and require a click for every install.
        SUAllowsAutomaticUpdates: false
        SUVerifyUpdateBeforeExtraction: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Modelo scans your local network to find LLM servers such as LM Studio, Ollama and llama-swap running on other machines.
        NSHumanReadableCopyright: "© 2025 Patrick Ruster"
    # See Signing.xcconfig for why signing is per-dev.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Modelo
        PRODUCT_MODULE_NAME: Modelo
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "6"
        ENABLE_HARDENED_RUNTIME: YES
        # Keychain access group → forces an embedded provisioning profile with
        # com.apple.application-identifier, required for the data-protection
        # keychain (see Modelo.entitlements). Without it, KeychainStore falls back
        # to the legacy login keychain and macOS prompts for a password per build.
        CODE_SIGN_ENTITLEMENTS: Modelo/Modelo.entitlements
        SWIFT_VERSION: "5.0"
  ModeloTests:
    type: bundle.unit-test
    platform: macOS
    # Same team as the app; without it, Xcode test runs fail to sign.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - ModeloTests
    dependencies:
      - target: Modelo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Distinct from the app's ID, which Signing.xcconfig would otherwise apply.
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).tests
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Modelo.app/Contents/MacOS/Modelo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Modelo:
    build:
      targets:
        Modelo: all
    test:
      targets:
        - ModeloTests
